<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2744"><title>{% block title %}ClinicalTrack{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="topbar"><a class="brand" href="/">Clinical<span>Track</span></a>{% if user.is_authenticated %}<div class="top-actions"><span>{{ user.get_full_name|default:user.username }}</span>{% if user.is_staff %}<a href="/admin/">Admin</a>{% endif %}<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Sign out</button></form></div>{% endif %}</header><main class="container">{% for message in messages %}<div class="notice">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
